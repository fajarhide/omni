<svg xmlns="http://www.w3.org/2000/svg" width="950" height="480" viewBox="0 0 950 480">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#8f5e0a" flood-opacity="0.14" />
    </filter>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- editorial light background, matching the performance dashboard -->
  <rect width="950" height="480" fill="#e8e8e3" />

  <!-- TOP TEXT -->
  <g text-anchor="middle">
    <text class="mono" x="475" y="52" fill="#8f5e0a" font-size="12" font-weight="700" letter-spacing="4">HOW IT WORKS</text>
    <text class="sans" x="475" y="92" fill="#1c1b19" font-size="32" font-weight="800">AI Agent → <tspan fill="#8f5e0a">OMNI</tspan> → Your Terminal</text>
  </g>

  <!-- BOX 1: AI Agent -->
  <g transform="translate(40, 140)">
    <rect width="250" height="260" rx="16" fill="#f3f3ee" stroke="#dcdcd4" stroke-width="1.5" filter="url(#soft)" />

    <rect x="24" y="24" width="40" height="40" rx="10" fill="#2b2a27" />
    <path d="M 34 36 L 42 44 L 34 52 M 46 52 L 54 52" fill="none" stroke="#e8e8e3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text class="sans" x="78" y="50" fill="#1c1b19" font-size="20" font-weight="700">AI Agents</text>

    <text class="sans" x="24" y="95" fill="#5f5f56" font-size="14">
      <tspan x="24" dy="0">Runs autonomous commands.</tspan>
      <tspan x="24" dy="22">Gets back only the signal —</tspan>
      <tspan x="24" dy="22">reversible, and it never</tspan>
      <tspan x="24" dy="22">fabricates a result.</tspan>
    </text>

    <rect x="24" y="190" width="98" height="28" rx="14" fill="#eceae2" stroke="#cfcdc4" stroke-width="1" />
    <text class="mono" x="73" y="208" fill="#4a4942" font-size="12" font-weight="500" text-anchor="middle">Claude Code</text>
    <rect x="130" y="190" width="66" height="28" rx="14" fill="#eceae2" stroke="#cfcdc4" stroke-width="1" />
    <text class="mono" x="163" y="208" fill="#4a4942" font-size="12" font-weight="500" text-anchor="middle">Cursor</text>
    <rect x="24" y="226" width="66" height="28" rx="14" fill="#eceae2" stroke="#cfcdc4" stroke-width="1" />
    <text class="mono" x="57" y="244" fill="#4a4942" font-size="12" font-weight="500" text-anchor="middle">Codex</text>
    <rect x="98" y="226" width="60" height="28" rx="14" fill="#eceae2" stroke="#cfcdc4" stroke-width="1" />
    <text class="mono" x="128" y="244" fill="#4a4942" font-size="12" font-weight="500" text-anchor="middle">Aider</text>
  </g>

  <!-- ARROWS 1 -->
  <g transform="translate(300, 220)">
    <text class="mono" x="25" y="-12" fill="#4a4942" font-size="11" font-weight="600" text-anchor="middle">run command</text>
    <line x1="0" y1="0" x2="50" y2="0" stroke="#4a4942" stroke-width="2.5" />
    <polygon points="50,-5 58,0 50,5" fill="#4a4942" />

    <line x1="50" y1="40" x2="0" y2="40" stroke="#8f5e0a" stroke-width="2.5" />
    <polygon points="0,35 -8,40 0,45" fill="#8f5e0a" />
    <text class="mono" x="25" y="60" fill="#8f5e0a" font-size="11" font-weight="700" text-anchor="middle">clean signal</text>
    <text class="mono" x="25" y="76" fill="#8f5e0a" font-size="11" text-anchor="middle">(~1.3 KB)</text>
  </g>

  <!-- BOX 2: OMNI Engine — the amber-accented star -->
  <g transform="translate(370, 140)">
    <rect width="250" height="260" rx="16" fill="#f6f2e9" stroke="#8f5e0a" stroke-width="2" filter="url(#soft)" />

    <rect x="24" y="24" width="40" height="40" rx="10" fill="#8f5e0a" />
    <polygon points="44,30 52,48 36,48" fill="none" stroke="#f6f2e9" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="44" cy="42" r="2.5" fill="#f6f2e9" />
    <text class="sans" x="78" y="50" fill="#1c1b19" font-size="20" font-weight="700">OMNI Engine</text>

    <text class="sans" x="24" y="95" fill="#57544c" font-size="14">
      <tspan x="24" dy="0">Intercepts each tool call,</tspan>
      <tspan x="24" dy="22">distills the noise, hands back</tspan>
      <tspan x="24" dy="22">only what the agent needs —</tspan>
      <tspan x="24" dy="22">the original one call away.</tspan>
    </text>

    <rect x="24" y="190" width="112" height="28" rx="14" fill="#efe3cb" stroke="#d8b878" stroke-width="1" />
    <text class="mono" x="80" y="208" fill="#8f5e0a" font-size="12" font-weight="600" text-anchor="middle">Score → Distill</text>
    <rect x="144" y="190" width="86" height="28" rx="14" fill="#efe3cb" stroke="#d8b878" stroke-width="1" />
    <text class="mono" x="187" y="208" fill="#8f5e0a" font-size="12" font-weight="600" text-anchor="middle">Format-safe</text>
    <rect x="24" y="226" width="100" height="28" rx="14" fill="#efe3cb" stroke="#d8b878" stroke-width="1" />
    <text class="mono" x="74" y="244" fill="#8f5e0a" font-size="12" font-weight="600" text-anchor="middle">RewindStore</text>
    <rect x="132" y="226" width="98" height="28" rx="14" fill="#efe3cb" stroke="#d8b878" stroke-width="1" />
    <text class="mono" x="181" y="244" fill="#8f5e0a" font-size="12" font-weight="600" text-anchor="middle">MCP memory</text>
  </g>

  <!-- ARROWS 2 -->
  <g transform="translate(630, 220)">
    <text class="mono" x="25" y="-12" fill="#4a4942" font-size="11" font-weight="600" text-anchor="middle">execute</text>
    <line x1="0" y1="0" x2="50" y2="0" stroke="#4a4942" stroke-width="2.5" />
    <polygon points="50,-5 58,0 50,5" fill="#4a4942" />

    <line x1="50" y1="40" x2="0" y2="40" stroke="#9a988c" stroke-width="2.5" />
    <polygon points="0,35 -8,40 0,45" fill="#9a988c" />
    <text class="mono" x="25" y="60" fill="#83817a" font-size="11" font-weight="700" text-anchor="middle">raw noise</text>
    <text class="mono" x="25" y="76" fill="#83817a" font-size="11" text-anchor="middle">(~25 KB)</text>
  </g>

  <!-- BOX 3: Terminal / Shell -->
  <g transform="translate(700, 140)">
    <rect width="210" height="260" rx="16" fill="#f3f3ee" stroke="#dcdcd4" stroke-width="1.5" filter="url(#soft)" />

    <rect x="24" y="24" width="40" height="40" rx="10" fill="#2b2a27" />
    <rect x="30" y="32" width="28" height="24" rx="4" fill="none" stroke="#e8e8e3" stroke-width="2" />
    <line x1="34" y1="38" x2="42" y2="38" stroke="#d8b878" stroke-width="2" stroke-linecap="round" />
    <text class="sans" x="78" y="50" fill="#1c1b19" font-size="20" font-weight="700">The Shell</text>

    <text class="sans" x="24" y="95" fill="#5f5f56" font-size="14">
      <tspan x="24" dy="0">Runs the actual command.</tspan>
      <tspan x="24" dy="22">Outputs massive, noisy logs</tspan>
      <tspan x="24" dy="22">filled with progress bars,</tspan>
      <tspan x="24" dy="22">warnings, and redundancy.</tspan>
    </text>

    <rect x="24" y="190" width="86" height="28" rx="14" fill="#eceae2" stroke="#cfcdc4" stroke-width="1" />
    <text class="mono" x="67" y="208" fill="#4a4942" font-size="12" font-weight="500" text-anchor="middle">cargo test</text>
    <rect x="118" y="190" width="70" height="28" rx="14" fill="#eceae2" stroke="#cfcdc4" stroke-width="1" />
    <text class="mono" x="153" y="208" fill="#4a4942" font-size="12" font-weight="500" text-anchor="middle">git log</text>
    <rect x="24" y="226" width="80" height="28" rx="14" fill="#eceae2" stroke="#cfcdc4" stroke-width="1" />
    <text class="mono" x="64" y="244" fill="#4a4942" font-size="12" font-weight="500" text-anchor="middle">kubectl</text>
    <rect x="112" y="226" width="76" height="28" rx="14" fill="#eceae2" stroke="#cfcdc4" stroke-width="1" />
    <text class="mono" x="150" y="244" fill="#4a4942" font-size="12" font-weight="500" text-anchor="middle">docker</text>
  </g>

  <!-- Bottom text -->
  <g text-anchor="middle" class="sans">
    <text x="475" y="440" fill="#5f5f56" font-size="14">
      OMNI intercepts your agent's tool calls, distills the massive stdout in real time, and feeds back
    </text>
    <text x="475" y="465" fill="#5f5f56" font-size="14">
      <tspan fill="#1c1b19" font-weight="700">only the lines the AI needs</tspan> — losslessly reversible, and it never invents a result.
    </text>
  </g>

  <text class="mono" x="915" y="466" fill="#b6b4a8" font-size="11" font-weight="600" letter-spacing="2" text-anchor="end">REVERSIBLE</text>
</svg>
