<svg xmlns="http://www.w3.org/2000/svg" width="950" height="480" viewBox="0 0 950 480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#282a36" />
      <stop offset="100%" stop-color="#191a21" />
    </radialGradient>

    <linearGradient id="box1Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3040" />
      <stop offset="100%" stop-color="#21232f" />
    </linearGradient>

    <linearGradient id="box2Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2d5c" />
      <stop offset="100%" stop-color="#241a3a" />
    </linearGradient>

    <linearGradient id="box3Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2c38" />
      <stop offset="100%" stop-color="#1c1d26" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="950" height="480" fill="url(#bg)" />

  <!-- TOP TEXT -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="475" y="55" fill="#bd93f9" font-size="12" font-weight="700" letter-spacing="3">HOW IT WORKS</text>
    <text x="475" y="95" fill="#f8f8f2" font-size="32" font-weight="800">AI Agent → <tspan fill="#ff79c6">OMNI</tspan> → Your Terminal</text>
  </g>

  <!-- BOX 1: AI Agent -->
  <g transform="translate(40, 140)">
    <rect width="250" height="260" rx="16" fill="url(#box1Bg)" stroke="#44475a" stroke-width="1.5" />

    <!-- Header -->
    <rect x="24" y="24" width="40" height="40" rx="10" fill="#8be9fd" />
    <path d="M 34 36 L 42 44 L 34 52 M 46 52 L 54 52" fill="none" stroke="#282a36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="78" y="50" fill="#f8f8f2" font-size="20" font-weight="600" font-family="-apple-system, sans-serif">AI Agents</text>

    <!-- Content -->
    <text x="24" y="95" fill="#a9b1cf" font-size="14" font-family="-apple-system, sans-serif">
      <tspan x="24" dy="0">Runs autonomous commands.</tspan>
      <tspan x="24" dy="22">Gets back only the signal —</tspan>
      <tspan x="24" dy="22">reversible, and it never</tspan>
      <tspan x="24" dy="22">fabricates a result.</tspan>
    </text>

    <!-- Pills -->
    <rect x="24" y="190" width="95" height="28" rx="14" fill="#21374a" stroke="#8be9fd" stroke-width="1" opacity="0.9" />
    <text x="71.5" y="209" fill="#8be9fd" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">Claude Code</text>

    <rect x="127" y="190" width="70" height="28" rx="14" fill="#21374a" stroke="#8be9fd" stroke-width="1" opacity="0.9" />
    <text x="162" y="209" fill="#8be9fd" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">Cursor</text>

    <rect x="24" y="226" width="70" height="28" rx="14" fill="#21374a" stroke="#8be9fd" stroke-width="1" opacity="0.9" />
    <text x="59" y="245" fill="#8be9fd" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">Codex</text>

    <rect x="102" y="226" width="62" height="28" rx="14" fill="#21374a" stroke="#8be9fd" stroke-width="1" opacity="0.9" />
    <text x="133" y="245" fill="#8be9fd" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">Aider</text>
  </g>

  <!-- ARROWS 1 -->
  <g transform="translate(300, 220)">
    <!-- Top Arrow: Agent -> Engine -->
    <text x="25" y="-12" fill="#bd93f9" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">run command</text>
    <line x1="0" y1="0" x2="50" y2="0" stroke="#bd93f9" stroke-width="2.5" />
    <polygon points="50,-5 58,0 50,5" fill="#bd93f9" />

    <!-- Bottom Arrow: Engine -> Agent -->
    <line x1="50" y1="40" x2="0" y2="40" stroke="#50fa7b" stroke-width="2.5" />
    <polygon points="0,35 -8,40 0,45" fill="#50fa7b" />
    <text x="25" y="60" fill="#50fa7b" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">clean signal</text>
    <text x="25" y="76" fill="#50fa7b" font-size="11" font-family="monospace" text-anchor="middle">(~1.3 KB)</text>
  </g>

  <!-- BOX 2: OMNI Engine -->
  <g transform="translate(370, 140)">
    <!-- Glowing background -->
    <rect width="250" height="260" rx="16" fill="url(#box2Bg)" opacity="0.8" filter="url(#glow)"/>
    <rect width="250" height="260" rx="16" fill="url(#box2Bg)" stroke="#bd93f9" stroke-width="1.5" />

    <!-- Header -->
    <rect x="24" y="24" width="40" height="40" rx="10" fill="#bd93f9" />
    <polygon points="44,30 52,48 36,48" fill="none" stroke="#282a36" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="44" cy="42" r="2.5" fill="#282a36" />

    <text x="78" y="50" fill="#f8f8f2" font-size="20" font-weight="600" font-family="-apple-system, sans-serif">OMNI Engine</text>

    <!-- Content -->
    <text x="24" y="95" fill="#e8e8f0" font-size="14" font-family="-apple-system, sans-serif">
      <tspan x="24" dy="0">Intercepts each tool call,</tspan>
      <tspan x="24" dy="22">distills the noise, hands back</tspan>
      <tspan x="24" dy="22">only what the agent needs —</tspan>
      <tspan x="24" dy="22">the original one call away.</tspan>
    </text>

    <!-- Pills -->
    <rect x="24" y="190" width="112" height="28" rx="14" fill="#2f2547" stroke="#bd93f9" stroke-width="1" opacity="0.9" />
    <text x="80" y="209" fill="#d6bbfc" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">Score → Distill</text>

    <rect x="144" y="190" width="88" height="28" rx="14" fill="#2f2547" stroke="#bd93f9" stroke-width="1" opacity="0.9" />
    <text x="188" y="209" fill="#d6bbfc" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">Format-safe</text>

    <rect x="24" y="226" width="102" height="28" rx="14" fill="#2f2547" stroke="#bd93f9" stroke-width="1" opacity="0.9" />
    <text x="75" y="245" fill="#d6bbfc" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">RewindStore</text>

    <rect x="134" y="226" width="98" height="28" rx="14" fill="#2f2547" stroke="#bd93f9" stroke-width="1" opacity="0.9" />
    <text x="183" y="245" fill="#d6bbfc" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">MCP memory</text>
  </g>

  <!-- ARROWS 2 -->
  <g transform="translate(630, 220)">
    <!-- Top Arrow: Engine -> Terminal -->
    <text x="25" y="-12" fill="#bd93f9" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">execute</text>
    <line x1="0" y1="0" x2="50" y2="0" stroke="#bd93f9" stroke-width="2.5" />
    <polygon points="50,-5 58,0 50,5" fill="#bd93f9" />

    <!-- Bottom Arrow: Terminal -> Engine -->
    <line x1="50" y1="40" x2="0" y2="40" stroke="#ff5555" stroke-width="2.5" />
    <polygon points="0,35 -8,40 0,45" fill="#ff5555" />
    <text x="25" y="60" fill="#ff6e6e" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">raw noise</text>
    <text x="25" y="76" fill="#ff6e6e" font-size="11" font-family="monospace" text-anchor="middle">(~25 KB)</text>
  </g>

  <!-- BOX 3: Terminal / OS -->
  <g transform="translate(700, 140)">
    <rect width="210" height="260" rx="16" fill="url(#box3Bg)" stroke="#44475a" stroke-width="1.5" />

    <!-- Header -->
    <rect x="24" y="24" width="40" height="40" rx="10" fill="#282a36" stroke="#6272a4" />
    <rect x="30" y="32" width="28" height="24" rx="4" fill="none" stroke="#f8f8f2" stroke-width="2" />
    <line x1="34" y1="38" x2="42" y2="38" stroke="#50fa7b" stroke-width="2" stroke-linecap="round" />

    <text x="78" y="50" fill="#f8f8f2" font-size="20" font-weight="600" font-family="-apple-system, sans-serif">The Shell</text>

    <!-- Content -->
    <text x="24" y="95" fill="#a9b1cf" font-size="14" font-family="-apple-system, sans-serif">
      <tspan x="24" dy="0">Runs the actual command.</tspan>
      <tspan x="24" dy="22">Outputs massive, noisy logs</tspan>
      <tspan x="24" dy="22">filled with progress bars,</tspan>
      <tspan x="24" dy="22">warnings, and redundancy.</tspan>
    </text>

    <!-- Pills -->
    <rect x="24" y="190" width="85" height="28" rx="14" fill="#3a1f28" stroke="#ff5555" stroke-width="1" opacity="0.85" />
    <text x="66.5" y="209" fill="#ff8f8f" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">cargo test</text>

    <rect x="117" y="190" width="72" height="28" rx="14" fill="#3a1f28" stroke="#ff5555" stroke-width="1" opacity="0.85" />
    <text x="153" y="209" fill="#ff8f8f" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">git log</text>

    <rect x="24" y="226" width="88" height="28" rx="14" fill="#3a1f28" stroke="#ff5555" stroke-width="1" opacity="0.85" />
    <text x="68" y="245" fill="#ff8f8f" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">kubectl</text>

    <rect x="120" y="226" width="69" height="28" rx="14" fill="#3a1f28" stroke="#ff5555" stroke-width="1" opacity="0.85" />
    <text x="154.5" y="245" fill="#ff8f8f" font-size="12" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="middle">docker</text>
  </g>

  <!-- Bottom text -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="475" y="440" fill="#a9b1cf" font-size="14">
      OMNI intercepts your agent's tool calls, distills the massive stdout in real time, and feeds back
    </text>
    <text x="475" y="465" fill="#a9b1cf" font-size="14">
      <tspan fill="#f8f8f2" font-weight="600">only the lines the AI needs</tspan> — losslessly reversible, and it never invents a result.
    </text>
  </g>
</svg>
