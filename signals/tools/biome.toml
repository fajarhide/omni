schema_version = 1

# Biome, and ultracite which wraps it.
#
# Its own filter rather than a few patterns added to `eslint.toml`, because the
# output shapes have nothing in common: eslint prints one line per problem, biome
# prints a block per problem with a code frame, a rule banner and one or more `ℹ`
# explanation paragraphs. `eslint.toml` claimed `biome` and saved 0.0% on it,
# which is the honest outcome of matching a command whose format you do not know.
#
# **Strip, never keep, and no `on_empty`.** With `strip_lines_matching` a pattern
# that fails to match removes nothing, so a wrong claim costs a passthrough and
# never an answer. A keep list would delete every line biome adds in a future
# release, and an `on_empty` would let a run with no recognised lines report a
# clean result it never established (#224).
#
# What is kept, deliberately: the `path:line:col rule/name` header of every
# diagnostic, the `✖`/`⚠` message that says what is wrong, and the final tally.
# Those are the three things an agent needs to act. What goes is the code frame,
# the rule explanations and the box drawing, which restate the source the agent
# can already read and the documentation it can already look up.
[filters.biome]
description = "Biome and ultracite: keep every diagnostic's location, rule and message, drop the code frames"
match_command = "^(bunx |npx |pnpm dlx |yarn dlx )?(biome|ultracite)\\b"
strip_ansi = true
confidence = 0.9
priority = 160

strip_lines_matching = [
    # The code frame. Biome numbers the source lines and points at the span; both
    # restate a file the agent can open. The `>` marker line is the offending one
    # and its content is already named in the diagnostic header.
    "^\\s*>?\\s*\\d+\\s*│",
    "^\\s*│\\s*[\\^~]+\\s*$",
    "^\\s*\\d+\\s+\\d+\\s*│",
    # Rule prose and fix previews. `ℹ` is documentation, not a finding.
    "^\\s*ℹ ",
    # Box drawing left over once a header wraps.
    "^\\s*━+\\s*$",
    # Blank padding between blocks.
    "^\\s*$",
]

max_lines = 120

[[tests.biome]]
name = "keeps every location, rule and message, drops the frames"
input = """
apps/web/src/components/Chat.tsx:42:9 lint/correctness/noUnusedVariables  FIXABLE  ━━━━━━━━

  ✖ This variable is unused.

    40 │ export function Chat() {
  > 42 │   const unusedRef = useRef(null);
       │         ^^^^^^^^^
    43 │   return <div />;

  ℹ Unused variables are often the result of an incomplete refactoring.

  ℹ Safe fix: Remove the unused variable.

apps/server/src/db/schema.ts:118:1 lint/style/useImportType ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  ✖ All these imports are only used as types.

    116 │ import { eq } from "drizzle-orm";

  ℹ Importing the types with import type ensures they are removed by the compiler.

Checked 1284 files in 892ms. No fixes applied.
Found 2 errors.
"""
expected = """apps/web/src/components/Chat.tsx:42:9 lint/correctness/noUnusedVariables  FIXABLE  ━━━━━━━━
  ✖ This variable is unused.
apps/server/src/db/schema.ts:118:1 lint/style/useImportType ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ✖ All these imports are only used as types.
Checked 1284 files in 892ms. No fixes applied.
Found 2 errors."""

[[tests.biome]]
name = "a clean run keeps the line that says it is clean"
input = """
Checked 1284 files in 421ms. No fixes applied.
"""
expected = "Checked 1284 files in 421ms. No fixes applied."

[[tests.biome]]
name = "a warning is a finding and survives"
input = """
apps/web/src/lib/date.ts:9:3 lint/suspicious/noDoubleEquals  FIXABLE  ━━━━━━━━━━━━━━━

  ⚠ Use === instead of ==.

     8 │ if (a == b) {
       │       ^^

  ℹ == is only allowed when comparing against null.

Checked 12 files in 31ms.
Found 1 warning.
"""
expected = """apps/web/src/lib/date.ts:9:3 lint/suspicious/noDoubleEquals  FIXABLE  ━━━━━━━━━━━━━━━
  ⚠ Use === instead of ==.
Checked 12 files in 31ms.
Found 1 warning."""
